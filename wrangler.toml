# R2 media bucket for Aliante listing/hero photos.
# Git `public/images` and `public/og-image.jpg` remain the backup.
# Do not proxy www.aliantehomesforsale.com through Cloudflare (orange cloud).
# Custom media host example: media.aliantehomesforsale.com → this bucket (DNS only).

name = "aliante-homes-media"
compatibility_date = "2026-09-14"

# Set CLOUDFLARE_ACCOUNT_ID in CI / .env.local — do not commit account secrets.
# account_id = ""

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "aliante-homes-media"
